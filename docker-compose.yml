services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: rag_app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_URL=postgresql://postgres:postgres@db:5432/rag
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-large}
      - GEN_LLM_MODEL=${GEN_LLM_MODEL:-gpt-5-nano}
      - EVAL_LLM_MODEL=${EVAL_LLM_MODEL:-gpt-5-mini}
      - GEN_LLM_TEMPERATURE=${GEN_LLM_TEMPERATURE:-1.0}
      - EVAL_LLM_TEMPERATURE=${EVAL_LLM_TEMPERATURE:-0.0}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-bank_rag}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  pgdata: